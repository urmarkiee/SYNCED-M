name: Android CI & SyncedM APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Publish SyncedM Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Installable Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Versioned APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SyncedM-v1.0.3-debug.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncedM-v1.0.3-debug-apk
          path: dist/SyncedM-v1.0.3-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "SyncedM v1.0.3 — Android UAT APK"
          body: |
            ## SyncedM — Android testing build
            **Package ID:** `com.example.syncedn` | **Min SDK:** Android 7.0 (API 24) | **Target SDK:** API 37

            Download `SyncedM-v1.0.3-debug.apk` for installation and UAT testing.
            This is a debug-signed testing build, not a production-signed Play Store release.
            A production release requires the owner's private Android signing key.
          files: dist/SyncedM-v1.0.3-debug.apk
          prerelease: false
          make_latest: true